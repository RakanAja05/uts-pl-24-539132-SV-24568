# =============================================================================
# docker-compose.yml — Plant Collection (root of monorepo)
# Run with: docker compose up -d --build
#
# Services:
#   db            → MySQL 8.0  (named volume, data persists across restarts)
#   backend       → FrankenPHP / Laravel 13 (depends on db being healthy)
#   frontend      → Nginx 1.27 serving Vue SPA + /api reverse proxy to backend
#   prometheus    → Prometheus v2.53.0 (Monitoring & Alerting server)
#   grafana       → Grafana v11.1.0 (Metrics visualization & dashboards)
#   cadvisor      → cAdvisor v0.49.1 (Container resource & performance metrics)
#   node-exporter → Node Exporter v1.8.1 (Host hardware & OS metrics)
#
# All credentials and secrets are read from the .env file in this directory.
# =============================================================================

services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: plant_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Named volume: data persists even after "docker compose down"
      - db_data:/var/lib/mysql
    networks:
      - plant_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend (FrankenPHP + Laravel) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plant_backend
    restart: unless-stopped
    environment:
      # Application
      APP_NAME:    "Plant Collection"
      APP_ENV:     production
      APP_KEY:     ${APP_KEY}
      APP_DEBUG:   "false"
      APP_URL:     ${APP_URL:-http://localhost}

      # Database — uses the service name "db" as hostname (Docker internal DNS)
      DB_CONNECTION: mysql
      DB_HOST:       db
      DB_PORT:       3306
      DB_DATABASE:   ${DB_DATABASE}
      DB_USERNAME:   ${DB_USERNAME}
      DB_PASSWORD:   ${DB_PASSWORD}

      # Performance (file drivers are faster than database drivers)
      CACHE_STORE:      file
      SESSION_DRIVER:   file
      QUEUE_CONNECTION: sync

      # Sanctum
      SANCTUM_TRACK_LAST_USED_AT: "false"

      # Logging
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL:   ${LOG_LEVEL:-info}
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
    ports:
      # Expose backend directly for local API testing / Postman
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - plant_network

  # ── Frontend (Nginx + Vue SPA) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /api is a relative path — browser sends to frontend's Nginx,
        # which reverse-proxies to http://backend:8000 (Docker service name)
        VITE_API_URL: /api
    container_name: plant_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - plant_network

  # ── Prometheus (Metrics Collection & Alerting) ────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: plant_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - plant_network

  # ── Grafana (Visualization & Dashboards) ───────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: plant_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-RakanMonitoringP11!Strong}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus
    networks:
      - plant_network

  # ── cAdvisor (Container Resource & Performance Metrics) ───────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: plant_cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - plant_network

  # ── Node Exporter (Host Hardware & OS Metrics) ────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: plant_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - plant_network

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  plant_network:
    driver: bridge
