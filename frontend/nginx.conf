# Nginx configuration for the Vue SPA frontend container
# Two responsibilities:
#   1. Serve the compiled SPA and support client-side routing (try_files)
#   2. Reverse-proxy /api/* requests to the backend service via Docker network
#      (requests never leave the container network — they use the service name "backend")

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS resolver — required so nginx can resolve service names
    # at request time (not at startup), preventing "host not found" crash.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Reverse proxy: /api → backend service ─────────────────────────────────
    # Using a variable forces nginx to resolve the hostname at request time,
    # not at startup — so nginx starts even if backend is still initialising.
    location ^~ /api {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_request_buffering off;
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    # For any path that isn't a real file, serve index.html so Vue Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
}
