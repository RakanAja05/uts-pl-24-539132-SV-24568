# =============================================================================
# .github/workflows/ci.yml — GitHub Actions CI/CD Pipeline
# Plant Collection — UTS Pemrograman Lanjut
#
# Jobs:
#   1. test-backend   → PHP 8.3 + composer install + php artisan test
#   2. build-frontend → Node 22 + npm ci + npm run build
#   3. deploy         → Build & push Docker images to ghcr.io (main branch only)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  REGISTRY:         ghcr.io
  # Image names must be lowercase (GitHub Container Registry requirement)
  BACKEND_IMAGE:    ghcr.io/rakanaja05/uts-pl-24-539132-sv-24568-backend
  FRONTEND_IMAGE:   ghcr.io/rakanaja05/uts-pl-24-539132-sv-24568-frontend

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Backend Tests ───────────────────────────────────────────────────
  test-backend:
    name: "🧪 Test Backend (PHP 8.4)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, ctype, json, bcmath, zip, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Copy .env.example → .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate application key
        working-directory: backend
        # Use secret APP_KEY if configured in GitHub Secrets, otherwise generate one for testing
        run: |
          if [ -n "${{ secrets.APP_KEY }}" ]; then
            echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          else
            php artisan key:generate --ansi
          fi

      - name: Run PHPUnit test suite
        working-directory: backend
        # phpunit.xml already configures: DB_CONNECTION=sqlite, DB_DATABASE=:memory:
        # so no database service is required here
        run: php artisan test --no-ansi

  # ── Job 2: Frontend Build ──────────────────────────────────────────────────
  build-frontend:
    name: "🏗️  Build Frontend (Node 22)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        working-directory: frontend
        run: npm ci

      - name: Build Vite/Vue for production
        working-directory: frontend
        # VITE_API_URL=/api → relative path, proxied by Nginx to the backend service
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Upload dist artifact (optional — for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ── Job 3: Deploy (Docker images → ghcr.io) ───────────────────────────────
  # Condition: ONLY runs on push to main branch AND both test jobs must pass.
  deploy:
    name: "🚀 Deploy — Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Required permissions for GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Login to GitHub Container Registry ────────────────────────────────
      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Set up Docker Buildx (for multi-platform & layer caching) ─────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & Push Backend Image ─────────────────────────────────────────
      # Tag: ghcr.io/<owner>/<repo>-backend:<commit-sha>  (NOT "latest")
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          # Layer cache: reuse previous build layers from ghcr.io
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.BACKEND_IMAGE }}:cache,mode=max
          # Secrets used as build-time labels / metadata (NOT baked into image layers)
          # Runtime secrets (APP_KEY, DB_PASSWORD) are injected at container startup
          # via docker-compose environment — see soal 4b.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      # ── Build & Push Frontend Image ────────────────────────────────────────
      # Tag: ghcr.io/<owner>/<repo>-frontend:<commit-sha>  (NOT "latest")
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache
          cache-to:   type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print deployed image tags
        run: |
          echo "## 🚀 Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| backend  | \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Runtime secrets (APP_KEY, DB_PASSWORD) are injected via" >> $GITHUB_STEP_SUMMARY
          echo "> GitHub Secrets → docker-compose environment variables." >> $GITHUB_STEP_SUMMARY

      # ── Show how secrets are referenced (soal 4b) ──────────────────────────
      # In a real CD step (e.g., SSH deploy), you would use secrets like this:
      #
      # - name: Deploy to server via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /srv/plant-collection
      #       echo "APP_KEY=${{ secrets.APP_KEY }}"         > .env
      #       echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
      #       echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
      #       docker compose pull
      #       docker compose up -d
